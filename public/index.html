<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/zad.png">
    <link rel="shortcut icon" type="image/x-icon" href="/zad.ico">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/style.css">
    <!-- 新增 Markdown 解析库 marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 补充消息内MD标签样式，适配h1-h6、代码 */
        .assistant-message h1 {
            font-size: 22px;
            margin: 12px 0 8px;
            font-weight: 700;
        }
        .assistant-message h2 {
            font-size: 19px;
            margin: 10px 0 6px;
            font-weight: 600;
        }
        .assistant-message h3 {
            font-size: 17px;
            margin: 8px 0 4px;
            font-weight: 600;
        }
        .assistant-message h4, h5, h6 {
            font-size: 15px;
            margin: 6px 0 4px;
            font-weight: 600;
        }
        .assistant-message p {
            margin: 6px 0;
        }
        /* 行内代码 */
        .assistant-message code:not(pre code) {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }
        /* 代码块容器 */
        .assistant-message pre {
            background: #1e1e2e;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .assistant-message pre code {
            font-family: Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        /* 代码语言标签 */
        .code-lang-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            display: block;
        }
        /* 加粗文本 */
        .assistant-message strong {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>新对话</span>
                </button>
            </div>
            <div class="conversation-list" id="conversation-list"></div>
            <div class="sidebar-footer">
                <button class="toggle-sidebar-btn" id="toggle-sidebar-btn" title="收起侧栏">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="9" y1="3" x2="9" y2="21" />
                    </svg>
                </button>
            </div>
        </aside>
        <!-- 主聊天区 -->
        <div class="chat-container">
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-btn" id="menu-btn" title="展开侧栏">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="title-group">
                        <h1 id="chat-title">AI Chat</h1>
                        <span class="status-dot" id="status-dot"></span>
                        <span class="status-text" id="status-text">就绪</span>
                    </div>
                </div>
                <div class="header-right">
                    <a class="download-btn" id="download-btn" href="/download/" title="下载">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </a>
                    <button class="clear-btn" id="clear-btn" title="清空当前对话">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
                        </svg>
                    </button>
                </div>
            </header>
            <main class="chat-messages" id="chat-messages"></main>
            <div class="typing-indicator" id="typing-indicator">
                <span></span><span></span><span></span>
            </div>
            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <input type="file" id="file-input" class="file-input" accept=".js,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.h,.hpp,.cs,.go,.rs,.rb,.php,.swift,.kt,.scala,.r,.m,.mm,.sql,.sh,.bash,.zsh,.ps1,.bat,.cmd,.css,.scss,.sass,.less,.html,.htm,.xml,.json,.yaml,.yml,.toml,.ini,.cfg,.conf,.env,.md,.markdown,.txt,.log,.csv,.tsv,.vue,.svelte,.astro">
                    <textarea
                        id="user-input"
                        class="user-input"
                        placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                        rows="1"
                    ></textarea>
                    <button id="send-button" class="send-button" title="发送">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13" />
                            <polygon points="22 2 15 22 11 13 2 9 22 2" />
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <!-- 全局配置marked：无语言代码块自动替换为text -->
    <script>
        const originalCodeRender = marked.Renderer.prototype.code;
        marked.Renderer.prototype.code = function(code, lang, escaped) {
            // 空语言自动填充 text
            const langName = (lang && lang.trim()) || "text";
            // 增加语言标签展示
            return `
                <span class="code-lang-label">${langName}</span>
                ${originalCodeRender.call(this, code, langName, escaped)}
            `;
        };
        marked.setOptions({
            gfm: true,
            breaks: true, // 换行自动转<br>
        });

        // 全局工具函数：Markdown转HTML（AI回复专用）
        window.mdToHtml = function(mdText) {
            return marked.parse(mdText);
        };
    </script>

    <script src="/chat.js"></script>
</body>
</html>
