# Cloudflare Worker 配置（AI Code Editor 后端）
name = "ai-code-editor-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers AI binding：在 Worker 内通过 env.AI 调用模型
[ai]
binding = "AI"

# 模型覆盖（可选）：默认 @cf/meta/llama-3.1-8b-instruct
# 本地开发在 .dev.vars 中配置，部署后在 Dashboard 的 Variables 中配置
# [vars]
# AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
